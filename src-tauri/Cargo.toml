[package]
name = "loudr"
version = "0.2.0"
description = "Free, offline voice typing"
license = "MIT"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "loudr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "macos-private-api", "image-png"] }
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
cpal = "0.18.2"
hound = "3.5.1"
arboard = { version = "3.7.0", default-features = false }
enigo = "0.6.1"
whisper-rs = { version = "0.16.0", features = ["log_backend"] }
ureq = "3.5.1"
tauri-plugin-autostart = "2.7.0"
tauri-plugin-single-instance = "2.5.5"
ort = "=2.0.0-rc.15"
misaki-rs = { version = "0.8", default-features = false }
mp3lame-encoder = "0.3.0"
tauri-plugin-dialog = "2.8.4"

[target.'cfg(target_os = "macos")'.dependencies]
core-graphics = "0.25"
core-foundation = "0.10"
whisper-rs = { version = "0.16", features = ["metal"] }
objc2 = "0.6.5"
block2 = "0.6.2"
objc2-foundation = { version = "0.3.2", features = ["NSGeometry"] }

[target.'cfg(target_os = "windows")'.dependencies]
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }

# Dev builds: keep whisper.cpp fully optimised and our own code lightly
# optimised, so timings measured in `tauri dev` are close to release.
[profile.dev]
opt-level = 1

[profile.dev.package.whisper-rs-sys]
opt-level = 3

# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
