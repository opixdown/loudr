# Starts the Windows build and checks that it stays running, both as a new
# user and as a returning one (see scripts/windows-startup-check.ps1).
#
# Nobody on the project develops on Windows, so this is the only regular
# proof that the app opens there. If it stops within the first seconds, the
# reason (crash.log) and the app's log are printed and the run fails.
name: Windows startup

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - "scripts/windows-startup-check.ps1"
      - ".github/workflows/windows-startup.yml"
  workflow_dispatch:
    inputs:
      release:
        description: "Test a published installer instead of this code (tag, e.g. v0.2.0)"
        required: false

jobs:
  # Unpack a released .msi and start the app inside it.
  released:
    if: ${{ inputs.release }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unpack the released installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ inputs.release }}" --repo "${{ github.repository }}" --pattern "*.msi" --dir msi
          $msi = (Get-ChildItem msi\*.msi)[0].FullName
          $target = Join-Path $pwd "unpacked"
          Start-Process msiexec -ArgumentList "/a `"$msi`" /qn TARGETDIR=`"$target`"" -Wait
          $exe = (Get-ChildItem $target -Recurse -Filter loudr.exe)[0].FullName
          "LOUDR_EXE=$exe" >> $env:GITHUB_ENV

      - name: Start the released Loudr and see if it stays up
        shell: pwsh
        run: ./scripts/windows-startup-check.ps1 -Exe $env:LOUDR_EXE

  start:
    if: ${{ !inputs.release }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bumped when the build settings change, so stale C++ builds are not reused.
          prefix-key: v1-portable-cpu

      - run: npm ci

      # The same optimised build that goes into the installer.
      - run: npm run tauri build -- --no-bundle

      - name: Start Loudr and see if it stays up
        shell: pwsh
        run: ./scripts/windows-startup-check.ps1 -Exe src-tauri\target\release\loudr.exe

      # whisper.cpp must be built for AVX2, not for this server's CPU (see
      # src-tauri/.cargo/config.toml); otherwise Loudr closes with "illegal
      # instruction" on most laptops as soon as it loads a model.
      - name: Check whisper.cpp was built for every PC, not this one
        shell: pwsh
        run: |
          $cache = Get-ChildItem src-tauri\target\release\build -Recurse -Filter CMakeCache.txt |
            Where-Object { $_.FullName -match "whisper-rs-sys" } | Select-Object -First 1
          if (-not $cache) { Write-Host "whisper.cpp CMakeCache.txt not found"; exit 1 }
          $flags = Select-String -Path $cache.FullName -Pattern "^GGML_(NATIVE|AVX512|AVX2):"
          $flags | ForEach-Object { Write-Host $_.Line }
          if (-not ($flags.Line -contains "GGML_NATIVE:BOOL=OFF")) { Write-Host "GGML_NATIVE is not OFF"; exit 1 }
          if ($flags.Line -contains "GGML_AVX512:BOOL=ON") { Write-Host "AVX-512 is on"; exit 1 }
