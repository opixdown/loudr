# Builds the Linux installers (.deb and AppImage) and checks that each one
# starts. Nobody on the project develops on Linux, so this is the regular
# proof that the Linux build still works.
name: Linux build

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/linux-build.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

jobs:
  build:
    # Not older: the speech library Loudr links (ONNX Runtime) needs the C
    # library of Ubuntu 24.04 or newer, so that is also the oldest system the
    # installers run on.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev \
            build-essential cmake clang file xvfb libfuse2

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          # Bumped when the build settings change, so stale C++ builds are not reused.
          prefix-key: v1-portable-cpu

      - run: npm ci

      - run: npm run tauri build -- --bundles deb,appimage

      - name: What the app links against, and what the .deb asks for
        run: |
          ldd src-tauri/target/release/loudr | grep -vE "linux-vdso|ld-linux" | awk '{print $1}' | sort
          dpkg-deb -I src-tauri/target/release/bundle/deb/*.deb | grep -E "Depends|Version|Installed-Size"
          ls -la src-tauri/target/release/bundle/deb/*.deb src-tauri/target/release/bundle/appimage/*.AppImage

      - name: Install the .deb and see if Loudr starts
        run: |
          sudo apt-get install -y ./src-tauri/target/release/bundle/deb/*.deb
          # A desktop session has a message bus and a display; give CI both.
          dbus-run-session -- xvfb-run -a loudr &
          sleep 25
          log=$(find "$HOME" -name "Loudr.log" 2>/dev/null | head -1)
          if [ -n "$log" ]; then echo "===== $log ====="; cat "$log"; else echo "No log file found"; fi
          if ! pgrep -x loudr > /dev/null; then
            echo "Loudr stopped on its own"
            exit 1
          fi
          if ! grep -q "Loudr started" "$log"; then
            echo "Loudr is running but never finished starting"
            exit 1
          fi
          echo "Loudr (.deb) started and was still running after 25 seconds"
          pkill -x loudr
          sleep 2
          rm -f "$log"

      - name: Start the AppImage and see if it starts
        run: |
          image=$(ls src-tauri/target/release/bundle/appimage/*.AppImage)
          chmod +x "$image"
          # No FUSE inside CI, so let the AppImage unpack itself.
          APPIMAGE_EXTRACT_AND_RUN=1 dbus-run-session -- xvfb-run -a "$image" &
          sleep 30
          log=$(find "$HOME" -name "Loudr.log" 2>/dev/null | head -1)
          if [ -n "$log" ]; then echo "===== $log ====="; cat "$log"; else echo "No log file found"; fi
          if ! pgrep -x loudr > /dev/null; then
            echo "Loudr (AppImage) stopped on its own"
            exit 1
          fi
          if ! grep -q "Loudr started" "$log"; then
            echo "Loudr (AppImage) is running but never finished starting"
            exit 1
          fi
          echo "Loudr (AppImage) started and was still running after 30 seconds"
          pkill -x loudr || true
