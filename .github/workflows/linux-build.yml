# Builds Loudr on Linux and checks that it starts.
#
# Linux support is experimental and built from source only (no installer),
# so this is what keeps it compiling as the app changes.
name: Linux build

on:
  push:
    branches: [main]
    paths:
      - "src-tauri/**"
      - ".github/workflows/linux-build.yml"
  pull_request:
    paths:
      - "src-tauri/**"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev \
            libxdo-dev libssl-dev libasound2-dev \
            build-essential cmake clang file xvfb

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - run: npm run tauri build -- --no-bundle

      - name: Start Loudr and see if it stays up
        run: |
          xvfb-run -a src-tauri/target/release/loudr &
          sleep 20
          logs="$HOME/.local/share/app.loudr.desktop/logs"
          if [ -d "$logs" ]; then
            for file in "$logs"/*; do echo "===== $(basename "$file") ====="; cat "$file"; done
          else
            echo "No log folder at $logs"
          fi
          if ! pgrep -x loudr > /dev/null; then
            echo "Loudr stopped on its own"
            exit 1
          fi
          echo "Loudr was still running after 20 seconds"
          pkill -x loudr
