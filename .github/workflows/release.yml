# Builds the installers (.dmg for Apple Silicon, .msi for Windows x64).
# Push a tag like v0.1.0 to create a draft GitHub release with both attached,
# or run it by hand from the Actions tab to just get the build artifacts.
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest # Apple Silicon, Metal
            bundles: dmg
          - os: windows-latest # x64, CPU
            bundles: msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "-" means ad-hoc signing: no Apple Developer account needed, but
          # users must right-click > Open the first time. Replace with a
          # Developer ID (plus notarization secrets) to remove that warning.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          args: --bundles ${{ matrix.bundles }}
          # Only publish a release for tag pushes.
          tagName: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
          releaseName: Loudr ${{ github.ref_name }}
          releaseDraft: true

      - uses: actions/upload-artifact@v4
        with:
          name: loudr-${{ matrix.bundles }}
          path: |
            src-tauri/target/release/bundle/dmg/*.dmg
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
